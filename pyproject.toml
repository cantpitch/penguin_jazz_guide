[project]
name = "penguin-jazz-guide"
version = "0.1.0"
description = "Utility for tracking your progress in the Penguin Jazz Guide."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gspread>=6.2.1",
    "python3-discogs-client>=2.9",
]

[project.scripts]
penguin-jazz-guide = "penguin_jazz_guide.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["penguin_jazz_guide"]
